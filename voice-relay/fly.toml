app = "prince-caleb-lisa-relay"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_BASE_URL = "https://princecaleb.dev"
  PORT = "8080"
  PUBLIC_WEBSOCKET_URL = "wss://prince-caleb-lisa-relay.fly.dev/conversation"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
