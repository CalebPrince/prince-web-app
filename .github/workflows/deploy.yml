name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # Syntax-check every PHP file before anything touches the server — a
  # push with a parse error must fail here, not take production down.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1' # matches the minimum version the app targets
      - name: php -l all PHP files
        run: find src config database public -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install partial-sync tooling
        run: npm ci
      - name: Check partials/*.html haven't drifted from committed pages
        run: npm run sync:partials:check

  deploy:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Tailwind is a CI-only build dependency — the cPanel host never runs
      # Node. This compiles public/css/tailwind.build.css fresh on every
      # deploy; the file is gitignored and never committed. See README.md.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Tailwind CLI
        run: npm ci
      - name: Build Tailwind CSS
        run: npm run build

      # The FTP account must be rooted at the cPanel home directory so both
      # the web root and the above-webroot app folders are reachable.
      # public_html/.htaccess is NOT ours to overwrite. cPanel's Node.js
      # Selector writes the CloudLinux/Passenger block into it to bind the
      # nextjs-web app to the apex domain, so the server's copy always has
      # content this repo has never seen. Syncing our copy over it unbinds
      # the Node app: the apex falls back to DirectoryIndex home.html and
      # every migrated route 404s through PHP. That is what took the new
      # site down on 2026-08-20, and it is the most likely explanation for
      # the file going empty on 2026-08-15 too.
      #
      # `exclude` replaces the action's default list rather than adding to
      # it, so the three defaults are repeated here. The pattern is the
      # bare filename on purpose: it matches only public/.htaccess, while
      # admin/, js/vendor/, triplepmed-demo/ and uploads/ keep theirs.
      #
      # Consequence: edits to the CSP (or anything else in that file) no
      # longer deploy. Apply them by hand in cPanel File Manager, keeping
      # the Passenger block at the top intact, and keep this repo's copy
      # updated to match so it stays the readable source of truth.
      - name: Sync public/ -> public_html/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: public/
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .htaccess

      - name: Sync src/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: src/
          server-dir: src/

      - name: Sync config/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: config/
          server-dir: config/

      - name: Sync database/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: database/
          server-dir: database/

      # web/ (Next.js + shadcn) — cPanel's Node.js Selector (Phusion
      # Passenger) runs this as its own app, separate from the PHP site,
      # at nextjs-web/ alongside public_html/ (never inside the public
      # webroot). `output: "standalone"` (next.config.ts) produces a
      # minimal self-contained server (own server.js + only the
      # node_modules actually used at runtime, ~20MB vs 550MB+ for the
      # full dev+prod node_modules) — dramatically smaller than syncing
      # node_modules directly over FTP, which is slow and timeout-prone at
      # that size. public/ and .next/static/ aren't included in the
      # standalone output automatically (Next.js's own documented
      # behavior), so they're copied in before the sync. Built here in CI,
      # not on the server: cPanel Node apps don't run `npm install`/
      # `next build` on push, they just run server.js against whatever's
      # already in the app root.
      - name: Install web/ dependencies
        working-directory: web
        run: npm ci

      - name: Build web/ (Next.js standalone)
        working-directory: web
        run: npm run build

      # Passenger restarts an app when the mtime of tmp/restart.txt inside
      # its app root changes — this is the standard (and only) documented
      # way to pick up a new deploy without an SSH session. This file must
      # be part of the SAME sync as the rest of the build: FTP-Deploy-Action
      # tracks state per server-dir (state-name defaults to the same
      # .ftp-deploy-sync-state.json for every call), so a second call
      # against the same server-dir with a smaller local-dir deletes
      # everything the first call just uploaded that isn't in that smaller
      # set — which is exactly what silently wiped every deploy here before
      # this was fixed.
      - name: Assemble standalone deploy bundle
        working-directory: web
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          mkdir -p .next/standalone/tmp
          date > .next/standalone/tmp/restart.txt

      # FTP-Deploy-Action's default `exclude` list drops **/node_modules/**
      # unconditionally — fine for the PHP syncs (Node dependencies never
      # belong on that server), but standalone Next.js output ships its own
      # required node_modules/ inside .next/standalone/, and excluding it
      # is exactly what made server.js unable to `require("next")` in
      # production. Override the exclude list here to keep node_modules
      # while still skipping VCS cruft.
      - name: Sync web/.next/standalone/ -> nextjs-web/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: web/.next/standalone/
          server-dir: nextjs-web/
          exclude: |
            **/.git*
            **/.git*/**
