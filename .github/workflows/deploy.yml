name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # Syntax-check every PHP file before anything touches the server — a
  # push with a parse error must fail here, not take production down.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1' # matches the minimum version the app targets
      - name: php -l all PHP files
        run: find src config database public -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install partial-sync tooling
        run: npm ci
      - name: Check partials/*.html haven't drifted from committed pages
        run: npm run sync:partials:check

  deploy:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Tailwind is a CI-only build dependency — the cPanel host never runs
      # Node. This compiles public/css/tailwind.build.css fresh on every
      # deploy; the file is gitignored and never committed. See README.md.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Tailwind CLI
        run: npm ci
      - name: Build Tailwind CSS
        run: npm run build

      # The FTP account must be rooted at the cPanel home directory so both
      # the web root and the above-webroot app folders are reachable.
      # public_html/.htaccess is NOT ours to overwrite. cPanel's Node.js
      # Selector writes the CloudLinux/Passenger block into it to bind the
      # nextjs-web app to the apex domain, so the server's copy always has
      # content this repo has never seen. Syncing our copy over it unbinds
      # the Node app: the apex falls back to DirectoryIndex home.html and
      # every migrated route 404s through PHP. That is what took the new
      # site down on 2026-08-20, and it is the most likely explanation for
      # the file going empty on 2026-08-15 too.
      #
      # `exclude` replaces the action's default list rather than adding to
      # it, so the three defaults are repeated here. The pattern is the
      # bare filename on purpose: it matches only public/.htaccess, while
      # admin/, js/vendor/, triplepmed-demo/ and uploads/ keep theirs.
      #
      # Consequence: edits to the CSP (or anything else in that file) no
      # longer deploy. Apply them by hand in cPanel File Manager, keeping
      # the Passenger block at the top intact, and keep this repo's copy
      # updated to match so it stays the readable source of truth.
      - name: Sync public/ -> public_html/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: public/
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .htaccess

      - name: Sync src/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: src/
          server-dir: src/

      - name: Sync config/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: config/
          server-dir: config/

      - name: Sync database/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: database/
          server-dir: database/

      # web/ (Next.js + shadcn) — cPanel's Node.js Selector (Phusion
      # Passenger) runs this as its own app, separate from the PHP site,
      # at nextjs-web/ alongside public_html/ (never inside the public
      # webroot). `output: "standalone"` (next.config.ts) produces a
      # minimal self-contained server (own server.js + only the
      # node_modules actually used at runtime, ~20MB vs 550MB+ for the
      # full dev+prod node_modules) — dramatically smaller than syncing
      # node_modules directly over FTP, which is slow and timeout-prone at
      # that size. public/ and .next/static/ aren't included in the
      # standalone output automatically (Next.js's own documented
      # behavior), so they're copied in before the sync. Built here in CI,
      # not on the server: cPanel Node apps don't run `npm install`/
      # `next build` on push, they just run server.js against whatever's
      # already in the app root.
      - name: Install web/ dependencies
        working-directory: web
        run: npm ci

      - name: Build web/ (Next.js standalone)
        working-directory: web
        run: npm run build

      # Passenger restarts an app when the mtime of tmp/restart.txt inside
      # its app root changes — this is the standard (and only) documented
      # way to pick up a new deploy without an SSH session. This file must
      # be part of the SAME sync as the rest of the build: FTP-Deploy-Action
      # tracks state per server-dir (state-name defaults to the same
      # .ftp-deploy-sync-state.json for every call), so a second call
      # against the same server-dir with a smaller local-dir deletes
      # everything the first call just uploaded that isn't in that smaller
      # set — which is exactly what silently wiped every deploy here before
      # this was fixed.
      - name: Assemble standalone deploy bundle
        working-directory: web
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          mkdir -p .next/standalone/tmp
          date > .next/standalone/tmp/restart.txt

      # Carry the PREVIOUS build's hashed chunks into this bundle so the sync
      # stops deleting assets that pages currently being served still point at.
      #
      # The sync mirrors: anything on the server that isn't in the local dir
      # gets removed. Chunk filenames are content-hashed, so every build
      # renames them and the old set is deleted the moment the new one lands —
      # while the outgoing Passenger process is still serving html that names
      # the old ones. That is one half of what blanked the homepage on
      # 2026-08-21 (the other half, an ISR page cached on disk, is gone now
      # that `/` renders per request). Keeping one generation costs a few MB
      # and closes the window for any page rendered just before the restart.
      #
      # `cp -rn` never overwrites, so a same-named file from the new build
      # always wins. A cache miss just restores today's behaviour.
      - name: Restore previous build's static assets
        uses: actions/cache/restore@v4
        with:
          path: web/.next/static-previous
          key: next-static-${{ github.run_id }}
          restore-keys: |
            next-static-

      - name: Merge previous static assets into the bundle
        working-directory: web
        run: |
          if [ -d .next/static-previous ]; then
            cp -rn .next/static-previous/. .next/standalone/.next/static/ || true
            echo "Carried forward $(find .next/static-previous -type f | wc -l) file(s) from the previous build."
          else
            echo "No previous static cache — first run with this step, nothing to carry forward."
          fi
          rm -rf .next/static-previous
          cp -r .next/static .next/static-previous

      - name: Save this build's static assets for the next deploy
        uses: actions/cache/save@v4
        with:
          path: web/.next/static-previous
          key: next-static-${{ github.run_id }}

      # FTP-Deploy-Action's default `exclude` list drops **/node_modules/**
      # unconditionally — fine for the PHP syncs (Node dependencies never
      # belong on that server), but standalone Next.js output ships its own
      # required node_modules/ inside .next/standalone/, and excluding it
      # is exactly what made server.js unable to `require("next")` in
      # production. Override the exclude list here to keep node_modules
      # while still skipping VCS cruft.
      - name: Sync web/.next/standalone/ -> nextjs-web/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: web/.next/standalone/
          server-dir: nextjs-web/
          exclude: |
            **/.git*
            **/.git*/**

      # Fetching the homepage is not enough to know a deploy worked: on
      # 2026-08-21 `/` returned a perfectly healthy 200 while every stylesheet
      # and script it referenced 404'd, so the page rendered as unstyled
      # markup. Anything that serves html naming assets that aren't there has
      # to fail this job rather than report success.
      #
      # Passenger restarts on the tmp/restart.txt that just synced, so allow a
      # little time for the new process to come up before judging it.
      - name: Smoke-test the deployed site
        run: |
          set -uo pipefail
          BASE="https://princecaleb.dev"

          for attempt in $(seq 1 10); do
            code=$(curl -sS -o /tmp/home.html -w '%{http_code}' --max-time 30 "$BASE/" || echo 000)
            [ "$code" = "200" ] && break
            echo "Attempt $attempt: homepage returned $code, waiting for the app to restart…"
            sleep 15
          done

          if [ "$code" != "200" ]; then
            echo "::error::Homepage returned HTTP $code after the deploy."
            exit 1
          fi

          # Every hashed asset the delivered html actually references. The
          # `|| true` matters: runners default to `bash -eo pipefail`, so a
          # no-match grep would kill the step before the explicit check below
          # could explain what went wrong.
          grep -o '/_next/static/[A-Za-z0-9_./-]*\.\(js\|css\)' /tmp/home.html \
            | sort -u > /tmp/assets.txt || true
          count=$(wc -l < /tmp/assets.txt)
          echo "Homepage OK. Checking $count referenced asset(s)…"

          if [ "$count" -eq 0 ]; then
            echo "::error::Homepage referenced no /_next/static assets — the build did not render as expected."
            exit 1
          fi

          failed=0
          while read -r path; do
            acode=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$path" || echo 000)
            if [ "$acode" != "200" ]; then
              echo "::error::$path returned HTTP $acode"
              failed=$((failed + 1))
            fi
          done < /tmp/assets.txt

          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed asset(s) referenced by the homepage are missing — the site will render unstyled."
            exit 1
          fi

          echo "All $count assets served. Deploy verified."
