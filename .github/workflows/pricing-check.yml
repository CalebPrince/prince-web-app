name: Validate website changes

on:
  pull_request:
    paths:
      - 'web/**'
      - 'src/Controllers/SettingsController.php'
      - '.github/workflows/pricing-check.yml'

permissions:
  contents: read

jobs:
  pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - run: php -l src/Controllers/SettingsController.php
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Lint pricing files
        working-directory: web
        run: npx eslint src/lib/service-pricing.ts src/app/pricing/page.tsx src/app/pricing/layout.tsx 'src/app/admin/(dashboard)/pricing/PricingClient.tsx'
      - name: Lint VidKre8 page
        working-directory: web
        run: npx eslint src/app/vidkre8/page.tsx src/app/vidkre8/VidKre8Studio.tsx src/components/MarketingUIWrapper.tsx
      - run: npm run build
        working-directory: web

      - name: Install layout browser
        working-directory: web
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check VidKre8 layout and interactions
        working-directory: web
        run: node scripts/check-vidkre8-layout.mjs
      - name: Upload VidKre8 layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidkre8-layout
          path: web/artifacts/vidkre8/
          if-no-files-found: ignore
