name: Validate service pricing

on:
  pull_request:
    paths:
      - 'web/**'
      - 'src/Controllers/SettingsController.php'
      - '.github/workflows/pricing-check.yml'

permissions:
  contents: read

jobs:
  pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - run: php -l src/Controllers/SettingsController.php
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Lint pricing files
        working-directory: web
        run: npx eslint src/lib/service-pricing.ts src/app/pricing/page.tsx src/app/pricing/layout.tsx 'src/app/admin/(dashboard)/pricing/PricingClient.tsx'
      - run: npm run build
        working-directory: web
