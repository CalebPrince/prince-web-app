  <script>
    (function () {
      var DUR = 9.326;
      var ACCENT = "#62ff98";
      var CREAM = "#f2fff6";
      var HAIR = "#262827";
      var byId = function (id) {
        return document.getElementById(id);
      };

      var panel = byId("f-05-voice-panel");
      var camera = byId("f-05-voice-camera");
      var stateEl = byId("f-05-voice-state");
      var waveSvg = byId("f-05-voice-wave");
      var dotSvg = byId("f-05-voice-dot");
      var dotCore = byId("f-05-voice-dot-core");
      var dotRing = byId("f-05-voice-dot-ring");
      var checkSvg = byId("f-05-voice-check");
      var checkPath = byId("f-05-voice-check-path");

      /* waveform — DETERMINISTIC baked profile, derived from bar index only */
      var BAR_N = 40;
      var BAR_W = 10;
      var BAR_PITCH = 19.54;
      var WAVE_MID = 105;
      var WAVE_MAX = 92;
      var BASE = [];
      for (var i = 0; i < BAR_N; i++) {
        var a = Math.sin(i * 1.37) * 0.5 + 0.5;
        var b = Math.sin(i * 0.61 + 1.1) * 0.5 + 0.5;
        var env = Math.sin((i / (BAR_N - 1)) * Math.PI);
        BASE.push(0.18 + (0.22 + 0.6 * (0.55 * a + 0.45 * b)) * (0.4 + 0.6 * env));
      }

      var NS = "http://www.w3.org/2000/svg";
      var bars = [];
      for (var j = 0; j < BAR_N; j++) {
        var rect = document.createElementNS(NS, "rect");
        rect.setAttribute("x", String(j * BAR_PITCH));
        rect.setAttribute("width", String(BAR_W));
        rect.setAttribute("y", String(WAVE_MID - 1.5));
        rect.setAttribute("height", "3");
        rect.setAttribute("fill", ACCENT);
        rect.setAttribute("opacity", "0.26");
        waveSvg.appendChild(rect);
        bars.push(rect);
      }

      /* the waveform goes live at 3.85s — analytic ramp, so every seek is exact */
      var WAVE_LIVE = 3.85;
      function barAmp(t, idx) {
        var s = WAVE_LIVE + idx * 0.012;
        var d = 0.45;
        if (t <= s) return 0;
        if (t >= s + d) return 1;
        var u = (t - s) / d;
        return 1 - Math.pow(1 - u, 3);
      }

      /* discrete-text-sequence — the panel's stepping state labels */
      var STATES = [
        { t: 0.0, text: "CALL US", accent: false },
        { t: 2.15, text: "CONNECTED", accent: true },
        { t: 5.95, text: "DETAILS CLARIFIED", accent: true },
        { t: 8.35, text: "NEXT STEP", accent: true }
      ];
      function stateAt(time) {
        for (var k = STATES.length - 1; k >= 0; k--) {
          if (time >= STATES[k].t) return STATES[k];
        }
        return STATES[0];
      }

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* collapsed starting states (seek-safe sets, never CSS-hidden) */
      tl.set([byId("f-05-voice-bar-1"), byId("f-05-voice-bar-2"), byId("f-05-voice-bar-3")], { scaleX: 0 }, 0);
      tl.set(byId("f-05-voice-underline"), { scaleX: 0 }, 0);
      tl.set(dotSvg, { opacity: 0, scale: 0 }, 0);
      tl.set(checkSvg, { opacity: 0 }, 0);
      tl.set(checkPath, { strokeDasharray: 60, strokeDashoffset: 60 }, 0);

      /* continuous driver — state text, live waveform, status pulse */
      var drv = { t: 0 };
      tl.to(
        drv,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            var t = drv.t;

            var st = stateAt(t);
            if (stateEl.textContent !== st.text) stateEl.textContent = st.text;
            stateEl.style.color = st.accent ? ACCENT : CREAM;

            for (var n = 0; n < BAR_N; n++) {
              var amp = barAmp(t, n);
              var osc = Math.abs(
                Math.sin(t * (7.4 + (n % 5) * 0.55) + n * 0.42) * 0.72 +
                  Math.sin(t * 3.1 + n * 0.19) * 0.28
              );
              var h = 3 + WAVE_MAX * BASE[n] * amp * (0.24 + 0.76 * osc);
              var el = bars[n];
              el.setAttribute("y", String(WAVE_MID - h / 2));
              el.setAttribute("height", String(h));
              el.setAttribute("opacity", String(0.26 + 0.74 * amp));
            }

            /* svg-icon-enrichment · pulse — SVG transform ATTRIBUTE around an
               explicit centre; ring lags the core by PI/2 */
            var p = Math.max(0, t - 2.15) * 3.35;
            var sC = 1 + Math.sin(p) * 0.12;
            var sR = 1 + Math.sin(p + Math.PI / 2) * 0.08;
            dotCore.setAttribute("transform", "translate(24 24) scale(" + sC + ") translate(-24 -24)");
            dotRing.setAttribute("transform", "translate(24 24) scale(" + sR + ") translate(-24 -24)");
            dotRing.style.opacity = String(0.5 + Math.sin(p) * 0.35);
          }
        },
        0
      );

      /* Scene 1 (0–2.1s) — the CALL US panel is held as hero and comes into focus */
      tl.fromTo(
        panel,
        { opacity: 0, scale: 0.94, filter: "blur(20px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.85, ease: "power3.out" },
        0.12
      );
      tl.fromTo(byId("f-05-voice-toprule"), { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.out" }, 0.1);
      tl.fromTo(
        [byId("f-05-voice-kicker"), byId("f-05-voice-num")],
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.06 },
        0.14
      );
      tl.fromTo(
        stateEl,
        { opacity: 0, scale: 0.88 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        0.55
      );
      tl.fromTo(byId("f-05-voice-headsweep"), { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.out" }, 0.62);
      tl.fromTo(byId("f-05-voice-baseline"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.95);
      tl.fromTo(byId("f-05-voice-stub"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 1.15);
      tl.fromTo(byId("f-05-voice-botrule"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 1.5);
      tl.fromTo(byId("f-05-voice-catalog"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.62);

      /* Scene 2 (2.1–3.8s) — it steps to its connected state; "let them call" at 2.6s */
      tl.fromTo(
        stateEl,
        { scale: 0.86, opacity: 0.25 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        2.15
      );
      tl.fromTo(dotSvg, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 2.15);
      tl.fromTo(
        byId("f-05-voice-headsweep"),
        { backgroundColor: HAIR },
        { backgroundColor: ACCENT, duration: 0.35, ease: "power2.out" },
        2.18
      );
      tl.fromTo(byId("f-05-voice-bar-1"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 2.2);
      tl.fromTo(byId("f-05-voice-num-1"), { opacity: 0.35 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 2.2);
      tl.fromTo(
        byId("f-05-voice-hero-1"),
        { opacity: 0, scale: 0.9, y: 26 },
        { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" },
        2.55
      );
      tl.fromTo(
        byId("f-05-voice-hero-2"),
        { opacity: 0, scale: 0.9, y: 26 },
        { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" },
        2.74
      );
      tl.fromTo(byId("f-05-voice-connector"), { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power2.out" }, 3.0);

      /* Scene 3 (3.8–5.9s) — the waveform runs live under the caller's question cue */
      tl.fromTo(
        byId("f-05-voice-baseline"),
        { backgroundColor: HAIR },
        { backgroundColor: "#48504b", duration: 0.4, ease: "power2.out" },
        3.85
      );
      tl.fromTo(
        byId("f-05-voice-caller-label"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        4.15
      );
      tl.fromTo(
        byId("f-05-voice-caller-line"),
        { opacity: 0, y: 22, scale: 0.97 },
        { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" },
        4.3
      );

      /* Scene 4 (5.9–8.3s) — DETAILS CLARIFIED confirms on "details" (6.0s) */
      tl.fromTo(
        stateEl,
        { scale: 0.86, opacity: 0.25 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        5.95
      );
      /* commit-synced micro push-in, then the camera re-locks */
      tl.fromTo(camera, { scale: 1 }, { scale: 1.008, duration: 0.7, ease: "power2.out" }, 5.95);
      tl.fromTo(byId("f-05-voice-bar-2"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 6.0);
      tl.fromTo(byId("f-05-voice-num-2"), { opacity: 0.35 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 6.0);
      tl.fromTo(checkSvg, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "none" }, 6.05);
      tl.fromTo(
        checkPath,
        { strokeDashoffset: 60 },
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        6.05
      );
      tl.fromTo(byId("f-05-voice-underline"), { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.out" }, 6.9);
      tl.fromTo(
        byId("f-05-voice-caller-label"),
        { color: "#48504b" },
        { color: ACCENT, duration: 0.3, ease: "none" },
        6.95
      );

      /* Scene 5 (8.3–9.326s) — NEXT STEP lands as the closing state and holds */
      tl.fromTo(
        stateEl,
        { scale: 0.86, opacity: 0.25 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        8.35
      );
      tl.fromTo(byId("f-05-voice-bar-3"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 8.4);
      tl.fromTo(byId("f-05-voice-num-3"), { opacity: 0.35 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 8.4);
      tl.fromTo(
        byId("f-05-voice-connector"),
        { backgroundColor: HAIR },
        { backgroundColor: ACCENT, duration: 0.35, ease: "power2.out" },
        8.45
      );

      window.__timelines["05-voice"] = tl;
    })();
  </script>
