<script>
  (function () {
    var DUR = 9.352;

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    var wordA = document.getElementById("cta-word-a");
    var wordB = document.getElementById("cta-word-b");
    var mark = document.getElementById("cta-mark");
    var wordmark = document.getElementById("cta-wordmark");
    var ruleStub = document.getElementById("cta-rule");
    var promise = document.getElementById("cta-promise");
    var caret = document.getElementById("cta-caret");
    var connector = document.getElementById("cta-connector");
    var plate = document.getElementById("cta-url-plate");
    var url = document.getElementById("cta-url");

    // left-to-right clip-path wipe, driven by a plain object so every seek is exact
    function wipe(el, at, dur, ease) {
      var o = { p: 0 };
      tl.fromTo(
        o,
        { p: 0 },
        {
          p: 1,
          duration: dur,
          ease: ease,
          onUpdate: function () {
            el.style.clipPath = "inset(0 " + ((1 - o.p) * 100).toFixed(3) + "% 0 0)";
          },
        },
        at
      );
    }

    /* ---------- Scene 1 (0.0-3.1s) — "questions" swaps in place into
       "conversations" as one unbroken chain (scale-swap-transition). ---------- */
    tl.fromTo(
      wordA,
      { scale: 0.86, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.05
    );
    // outgoing rushes away — power2.in, on the beat before "conversations" lands
    tl.to(wordA, { scale: 0.74, opacity: 0, duration: 0.36, ease: "power2.in" }, 1.62);
    // incoming arrives with weight, overlapping the exit by 0.15s
    tl.fromTo(
      wordB,
      { scale: 0.74, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.56, ease: "back.out(1.4)" },
      1.83
    );
    // the clear — shrink toward centre + fade, leaving a blank stage for the bloom
    tl.to(wordB, { scale: 0.62, opacity: 0, duration: 0.4, ease: "power2.in" }, 2.92);

    /* ---------- Scene 2 (3.1-4.5s) — the P mark blooms from zero on the cleared
       stage, the wordmark reveals beneath it (spring-pop-entrance). ---------- */
    tl.fromTo(
      mark,
      { scale: 0, opacity: 0, rotation: -5 },
      { scale: 1, opacity: 1, rotation: 0, duration: 0.62, ease: "back.out(1.35)" },
      3.26
    );
    wipe(wordmark, 3.64, 0.55, "power3.out");
    tl.fromTo(ruleStub, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 4.3);

    /* ---------- Scene 3 (4.5-7.0s) — the contact promise builds in discrete
       states on the voiceover cues (discrete-text-sequence). ---------- */

      { t: 0, html: "" },
      { t: 4.62, html: "built" },
      { t: 5.12, html: "built to" },
      { t: 5.5, html: "built to be" },
      { t: 6.02, html: 'built to be <span class="cta-hl">contacted</span>' },

    function htmlAt(time) {
      for (var i = SEQUENCE.length - 1; i >= 0; i--) {
        if (time >= SEQUENCE[i].t) return SEQUENCE[i].html;
      }
      return "";
    }
    var driver = { t: 0 };
    tl.to(
      driver,
      {
        t: DUR,
        duration: DUR,
        ease: "none",
        onUpdate: function () {
          var next = htmlAt(driver.t);
          if (promise.innerHTML !== next) promise.innerHTML = next;
        },
      },

    // caret — deterministic sin square wave, retired before the final hold
    tl.set(caret, { opacity: 0 }, 0);
    var blink = { p: 0 };

        ease: "none",

    tl.set(caret, { opacity: 0 }, 6.62);
