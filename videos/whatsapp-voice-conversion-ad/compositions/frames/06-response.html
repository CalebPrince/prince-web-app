      var gsap = window.gsap;

      tl.fromTo(
        "#r6-cat",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power1.out" },
        0.24

      /* discrete-text-sequence — sparse whole-state swaps, reverse-searched each frame.
         Shape: keystroke clusters -> pause -> fork -> one bulk correction that
         collapses the line onto its point. Jumps are instant; no tween between states. */
      var SEQ = [
        { t: 0.0, a: "", b: "" },
        { t: 0.22, a: "the", b: "" },
        { t: 0.36, a: "the bu", b: "" },
        { t: 0.5, a: "the butt", b: "" },
        { t: 0.62, a: "the button", b: "" },
        { t: 1.06, a: "the button", b: "is" },

        { t: 1.33, a: "the button", b: "is onl" },
        { t: 1.45, a: "the button", b: "is only" },
        { t: 1.86, a: "only the", b: "beginning" }

      var lineA = q("#r6-line-a");
      var lineB = q("#r6-line-b");
      var caret = q("#r6-caret");
      var caretBar = q("#r6-caret-bar");

      function stateAt(time) {
        for (var i = SEQ.length - 1; i >= 0; i--) {
          if (time >= SEQ[i].t) return SEQ[i];
        }
        return SEQ[0];
      }

      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: 2.3,
          duration: 2.3,
          ease: "none",
          onUpdate: function () {
            var s = stateAt(driver.t);
            if (lineA.textContent !== s.a) lineA.textContent = s.a;
            if (lineB.textContent !== s.b) lineB.textContent = s.b;
            var host = s.b ? lineB : lineA;
            if (caret.parentNode !== host) host.appendChild(caret);

        0
      );

      var blink = { p: 0 };

        blink,

          ease: "none",
