  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="02-friction"]');
      var q = function (sel) {
        return root.querySelector(sel);
      };

      var F = 1 / 60;
      var DUR = 10.606;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ═══ Scene 1 (0–3.2s) — the form accumulates: waterfall-entry rows,
         one per spoken field (Name / Email / Company / Budget). ═══ */
      var kicker1 = q("#fr02-kicker1");
      tl.fromTo(
        kicker1,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        0.05,
      );

      var rowStarts = [0.2, 1.05, 1.85, 2.7];
      var rowTravel = [60, 48, 46, 44];
      var rowDur = [0.18, 0.16, 0.15, 0.15];

      for (var i = 1; i <= 4; i++) {
        var row = q("#fr02-row-" + i);
        var label = q("#fr02-label-" + i);
        var track = q("#fr02-track-" + i);
        var fill = q("#fr02-fill-" + i);
        var t = rowStarts[i - 1];

        tl.set(row, { opacity: 1, y: rowTravel[i - 1] }, t);
        tl.to(row, { y: 0, duration: rowDur[i - 1], ease: "power4.out" }, t);

        var tLabel = t + rowDur[i - 1] - F;
        tl.set(label, { opacity: 1, y: 22 }, tLabel);
        tl.to(label, { y: 0, duration: 0.13, ease: "power4.out" }, tLabel);

        var tTrack = tLabel + 0.13 - F;
        tl.set(track, { opacity: 1 }, tTrack);

        var tFill = tTrack + 0.04;
        tl.to(
          fill,
          { scaleX: 1, duration: 0.22, ease: "power2.out" },
          tFill,
        );
      }

      /* ═══ Scene 2 (3.2–6.4s) — submit steps through discrete states to
         WAITING (discrete-text-sequence); the field panel greys down and
         a big "waiting…" word lands as the line reaches "silence". ═══ */
      var submit = q("#fr02-submit");
      var submitLabel = q("#fr02-submit-label");
      var rows = q("#fr02-rows");
      var waitword = q("#fr02-waitword");

      tl.fromTo(
        submit,
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" },
        2.98,
      );

      var SUBMIT_SEQUENCE = [
        { t: 2.98, text: "Submit" },
        { t: 3.4, text: "Submitting" },
        { t: 3.88, text: "Waiting" },
      ];
      function submitTextAt(time) {
        for (var s = SUBMIT_SEQUENCE.length - 1; s >= 0; s--) {
          if (time >= SUBMIT_SEQUENCE[s].t) return SUBMIT_SEQUENCE[s].text;
        }
        return "";
      }
      var submitDriver = { t: 2.98 };
      tl.to(
        submitDriver,
        {
          t: 4.3,
          duration: 4.3 - 2.98,
          ease: "none",
          onUpdate: function () {
            submitLabel.textContent = submitTextAt(submitDriver.t);
          },
        },
        2.98,
      );

      tl.to(rows, { opacity: 0.3, duration: 0.62, ease: "power2.out" }, 3.88);

      tl.fromTo(
        waitword,
        { opacity: 0, y: 26, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power4.out" },
        4.05,
      );

      /* held silence — panel stays grey, waiting word holds through 6.4s
         (a deliberate stillness beat: the line IS "then, silence"). */

      /* ═══ Scene 3 (6.4–8.1s) — the camera pans laterally to station 2
         (viewport-change) while the buyer's question streaks across the
         gap (motion-blur-streak, Path A: directional SVG blur). ═══ */
      var world = q("#fr02-world");
      var cam = { x: 0 };
      function applyCamera() {
        world.style.transform = "translateX(" + cam.x + "px)";
      }
      applyCamera();

      tl.to(
        cam,
        { x: -1080, duration: 1.7, ease: "power3.inOut", onUpdate: applyCamera },
        6.4,
      );

      var blurNode = q("#fr02-streak-blur");
      var PEAK_BLUR = 18;
      var blurProxy = { v: PEAK_BLUR };
      function writeBlur() {
        blurNode.setAttribute("stdDeviation", blurProxy.v + " 0");
      }
      writeBlur(); // seed frame 0 — a seek before the travel shows blur pre-armed

      var marker = q("#fr02-marker");
      var MOVE_START = 7.3;
      var MOVE_DUR = 0.5;
      tl.fromTo(
        marker,
        { x: 780, opacity: 0 },
        { x: 0, opacity: 1, duration: MOVE_DUR, ease: "power4.out" },
        MOVE_START,
      );
      tl.to(
        blurProxy,
        { v: 0, duration: MOVE_DUR, ease: "power4.out", onUpdate: writeBlur },
        MOVE_START,
      );

      /* ═══ Scene 4 (8.1–10.606s) — station 2 answers first: kicker,
         the "answered" word spring-pops in, a hairline connects it to the
         settled marker. Holds to the end (no exit — not the final frame,
         but this scene's punchline is a static landing). ═══ */
      var kicker2 = q("#fr02-kicker2");
      tl.fromTo(
        kicker2,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        8.15,
      );

      var heroword = q("#fr02-heroword");
      tl.fromTo(
        heroword,
        { opacity: 0, scale: 0.72, y: 18 },
        {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.4,
          ease: "back.out(1.8)",
        },
        8.3,
      );

      var connectPath = q("#fr02-connect-path");
      var connectLen = connectPath.getTotalLength();
      connectPath.style.strokeDasharray = String(connectLen);
      connectPath.style.strokeDashoffset = String(connectLen);
      tl.to(
        connectPath,
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        8.75,
      );

      // hold the resolved frame to the end — no exit (the root transition owns it)
      tl.to({}, { duration: 0.01 }, DUR - 0.01);

      window.__timelines["02-friction"] = tl;
    })();
  </script>
