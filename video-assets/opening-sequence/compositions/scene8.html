<!doctype html>

    <template>
      <style>

        .s8-logo {
          position: relative;
          margin: 0;

          font-family: "Inter", sans-serif;
          font-size: clamp(2.9rem, 8.5vw, 7.6rem);
          font-weight: 800;
          line-height: 0.95;
          letter-spacing: -0.07em;
          text-transform: uppercase;
          text-shadow: 0 0 20px rgba(255, 255, 255, 0.12), 0 0 60px rgba(0, 255, 102, 0.16);
          opacity: 0;
        }
        .s8-logo-ghost {
          position: absolute;
          inset: 0;
          margin: 0;
          font-family: "Inter", sans-serif;
          font-size: clamp(2.9rem, 8.5vw, 7.6rem);
          font-weight: 800;
          line-height: 0.95;

        .s8-logo-ghost.cyan { color: #00f7ff; }
        .s8-logo-ghost.red { color: #ff3158; }
        .s8-url { margin-top: 1.25rem; color: #00ff66; font-size: clamp(0.9rem, 2vw, 1.3rem); letter-spacing: 0.22em; text-transform: uppercase; opacity: 0; }
        .s8-tagline { margin-top: 2.1rem; color: rgba(255, 255, 255, 0.58); font-family: "Inter", sans-serif; font-size: clamp(1rem, 2vw, 1.28rem); opacity: 0; }
        .s8-cta {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 0.65rem;
          margin-top: 2.5rem;
          padding: 0.95rem 1.4rem;
          border: 1px solid rgba(0, 255, 102, 0.4);
          border-radius: 999px;
          background: rgba(0, 255, 102, 0.08);
          color: #8affb2;
          opacity: 0;
          transform: translateY(10px);
        }
      </style>

      <div id="root" data-composition-id="s8" data-width="1920" data-height="1080" data-duration="11.060">
        <div class="s8-content">
          <p class="s8-eyebrow" id="s8-eyebrow">System ready</p>
          <div class="s8-logo-wrap">
            <h1 class="s8-logo-ghost cyan" id="s8-ghost-cyan" data-layout-allow-overlap>Prince Caleb</h1>
            <h1 class="s8-logo-ghost red" id="s8-ghost-red" data-layout-allow-overlap>Prince Caleb</h1>
            <h1 class="s8-logo" id="s8-logo">Prince Caleb</h1>

        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#s8-eyebrow", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
        tl.fromTo("#s8-logo", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.2);
        // Chromatic-aberration glitch flicker on the final logo reveal.
        tl.set(["#s8-ghost-cyan", "#s8-ghost-red"], { opacity: 0.7 }, 0.2);
        tl.fromTo("#s8-ghost-cyan", { x: 0 }, { x: 5, duration: 0.07, ease: "none" }, 0.2);
        tl.to("#s8-ghost-cyan", { x: -4, duration: 0.07, ease: "none" }, 0.3);
        tl.to("#s8-ghost-cyan", { x: 0, opacity: 0, duration: 0.12, ease: "none" }, 0.4);
        tl.fromTo("#s8-ghost-red", { x: 0 }, { x: -5, duration: 0.07, ease: "none" }, 0.25);
        tl.to("#s8-ghost-red", { x: 4, duration: 0.07, ease: "none" }, 0.35);
        tl.to("#s8-ghost-red", { x: 0, opacity: 0, duration: 0.12, ease: "none" }, 0.42);

        tl.fromTo("#s8-url", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.65);
        tl.fromTo("#s8-tagline", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.95);
        tl.to("#s8-cta", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.35);

        window.__timelines["s8"] = tl;
      </script>
    </template>
