<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background:
            radial-gradient(circle at 50% 35%, rgba(0, 255, 102, 0.08), transparent 32%),
            linear-gradient(180deg, #020302 0%, #030504 55%, #010201 100%);
        }
        .ambient-glow {
          position: absolute;
          inset: -30%;
          background:
            radial-gradient(circle at 20% 30%, rgba(0, 247, 255, 0.08), transparent 24%),
            radial-gradient(circle at 80% 60%, rgba(179, 0, 255, 0.07), transparent 28%),
            radial-gradient(circle at 50% 50%, rgba(0, 255, 102, 0.08), transparent 35%);
        }
        .grid-background {
          position: absolute;
          inset: 0;
          opacity: 0.14;
          background-image:
            linear-gradient(rgba(0, 255, 102, 0.14) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 255, 102, 0.14) 1px, transparent 1px);
          background-size: 48px 48px;
          transform: perspective(700px) rotateX(62deg) scale(1.5);
          transform-origin: center bottom;
          mask-image: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent 72%);
          -webkit-mask-image: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent 72%);
        }
        .noise {
          position: absolute;
          inset: 0;
          opacity: 0.04;
          background-image: repeating-radial-gradient(
            circle at 0 0,
            rgba(255, 255, 255, 0.4) 0,
            rgba(255, 255, 255, 0.4) 1px,
            transparent 1px,
            transparent 3px
          );
          background-size: 5px 5px;
        }
        .vignette {
          position: absolute;
          inset: 0;
          box-shadow: inset 0 0 160px rgba(0, 0, 0, 0.95);
        }
        .scanlines {
          position: absolute;
          inset: 0;
          opacity: 0.2;
          background: repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 3px,
            rgba(0, 255, 102, 0.045) 4px
          );
        }
        .scanline {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: 120px;
          opacity: 0.18;
          background: linear-gradient(to bottom, transparent, rgba(0, 255, 102, 0.22), transparent);
        }
      </style>

      <div id="root" data-composition-id="bg" data-width="1920" data-height="1080" data-duration="39.5">
        <div class="ambient-glow" id="bg-glow" data-layout-allow-overflow></div>
        <div class="grid-background"></div>
        <div class="scanline" id="bg-scanline"></div>
        <div class="scanlines"></div>
        <div class="noise"></div>
        <div class="vignette"></div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const DURATION = 39.5;

        // Ambient glow: slow drift, originally a 14s alternate loop —
        // converted to a finite yoyo repeat per the determinism contract.
        const glowCycle = 14;
        const glowRepeat = Math.max(0, Math.floor(DURATION / glowCycle) - 1);
        tl.fromTo(
          "#bg-glow",
          { x: "-2%", y: "-2%", scale: 1 },
          { x: "2%", y: "2%", scale: 1.08, duration: glowCycle / 2, ease: "sine.inOut", yoyo: true, repeat: glowRepeat },
          0
        );

        // Scanline sweep: originally a 6s linear infinite loop — finite repeat.
        // Animates a transform (y), not a layout property, to stay smooth
        // under frame-by-frame seeking.
        const sweepCycle = 6;
        const sweepRepeat = Math.max(0, Math.floor(DURATION / sweepCycle) - 1);
        tl.fromTo(
          "#bg-scanline",
          { y: 1200 },
          { y: -300, duration: sweepCycle, ease: "none", repeat: sweepRepeat },
          0
        );

        window.__timelines["bg"] = tl;
      </script>
    </template>
  </body>
</html>
