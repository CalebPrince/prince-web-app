<!doctype html>
<html lang="en" data-resolution="square">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prince Caleb — Brand Sting</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --brand-primary: #050d08;
        --brand-accent: #62ff98;
      }
      body, html {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1080px;
        background: var(--brand-primary);
        overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #master-root {
        position: relative;
        width: 1080px;
        height: 1080px;
      }

      /* Track 0 — background: precise grid + restrained vignette glow */
      .bg-layer {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 46%, rgba(98, 255, 152, 0.10), transparent 55%),
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: auto, 54px 54px, 54px 54px;
        background-position: center;
      }

      /* Track 1 — kinetic type lines. The outer .kinetic-line is the
         framework-owned clip (visibility only); the inner .kinetic-inner
         carries the actual fade tween + a hard-kill at the exit boundary,
         so a non-linear seek can't land between clip-hide and tween-end. */
      .kinetic-line {
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        margin: 0;
        padding: 0 90px;
        box-sizing: border-box;
        transform: translateY(-50%);
        text-align: center;
      }
      .kinetic-inner {
        display: block;
        color: #f5f8f6;
        font-weight: 760;
        letter-spacing: -0.03em;
        line-height: 1.05;
        font-size: 92px;
        opacity: 0;
      }
      .kinetic-inner .accent { color: var(--brand-accent); }

      /* Track 2 — logo reveal (P brand mark) */
      .mark-wrap {
        position: absolute;
        top: 38%;
        left: 50%;
        width: 220px;
        height: 220px;
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 0;
      }
      .mark-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid var(--brand-accent);
        box-shadow: 0 0 60px 4px rgba(98, 255, 152, 0.35);
      }
      .mark-glyph {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #f5f8f6;
        font-size: 120px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      /* Track 3 — wordmark */
      .wordmark {
        position: absolute;
        top: 62%;
        left: 0;
        width: 100%;
        text-align: center;
        color: #aeb8b2;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: 0.02em;
        opacity: 0;
      }
      .wordmark .dot { color: var(--brand-accent); }
    </style>
  </head>
  <body>
    <div
      id="master-root"
      data-composition-id="brand-sting"
      data-width="1080"
      data-height="1080"
      data-start="0"
      data-duration="8"
    >
      <div class="bg-layer clip" id="bg-layer" data-start="0" data-duration="8" data-track-index="0"></div>

      <h1 class="kinetic-line clip" id="line-1" data-start="0.3" data-duration="1.3" data-track-index="1"><span class="kinetic-inner" id="line-1-inner">AI agents</span></h1>
      <h1 class="kinetic-line clip" id="line-2" data-start="1.6" data-duration="1.3" data-track-index="1"><span class="kinetic-inner" id="line-2-inner">that run your <span class="accent">business</span></span></h1>
      <h1 class="kinetic-line clip" id="line-3" data-start="2.9" data-duration="1.3" data-track-index="1"><span class="kinetic-inner" id="line-3-inner">while you <span class="accent">sleep</span></span></h1>

      <div class="mark-wrap clip" id="brand-mark" data-start="4.6" data-duration="3.4" data-track-index="2">
        <div class="mark-ring"></div>
        <div class="mark-glyph">P</div>
      </div>

      <div class="wordmark clip" id="wordmark" data-start="5.6" data-duration="2.4" data-track-index="3">princecaleb<span class="dot">.</span>dev</div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Background: gentle drift only, no hard cut — restrained motion per brand style.
        tl.fromTo(".bg-layer", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);

        // Line 1 — "AI agents". Exit tween + hard-kill land on the inner
        // span, not the clip element, so a seek to exactly 1.60s (line-2's
        // clip start) can't catch line-1's opacity mid-fade.
        tl.fromTo("#line-1-inner", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.3);
        tl.to("#line-1-inner", { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, 1.3);
        tl.set("#line-1-inner", { opacity: 0 }, 1.6);

        // Line 2 — "that run your business"
        tl.fromTo("#line-2-inner", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 1.6);
        tl.to("#line-2-inner", { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, 2.6);
        tl.set("#line-2-inner", { opacity: 0 }, 2.9);

        // Line 3 — "while you sleep", with a soft accent pulse on the last word.
        tl.fromTo("#line-3-inner", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.9);
        tl.fromTo("#line-3-inner .accent", { textShadow: "0 0 0 rgba(98,255,152,0)" },
          { textShadow: "0 0 26px rgba(98,255,152,0.85)", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.2);
        tl.to("#line-3-inner", { opacity: 0, duration: 0.15, ease: "power2.in" }, 4.05);
        tl.set("#line-3-inner", { opacity: 0 }, 4.2);

        // Brand mark reveal — scale + glow in, gentle hold, no exit (holds to end).
        tl.fromTo("#brand-mark", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.7)" }, 4.6);
        tl.fromTo(".mark-ring", { boxShadow: "0 0 0px 0px rgba(98,255,152,0)" },
          { boxShadow: "0 0 60px 4px rgba(98,255,152,0.35)", duration: 0.6, ease: "power2.out" }, 4.6);

        // Wordmark — fades in under the mark, holds to end.
        tl.fromTo("#wordmark", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 5.6);

        window.__timelines["brand-sting"] = tl;
      </script>
    </div>
  </body>
</html>
