<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f6f4ef;
      }
      body { font-family: "Inter", sans-serif; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="35.33"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="bg-comp"
        class="clip"
        data-composition-id="bg"
        data-composition-src="compositions/background.html"
        data-start="0"
        data-duration="35.33"
        data-track-index="0"
      ></div>

      <div
        id="scene-1"
        class="clip"
        data-composition-id="s1"
        data-composition-src="compositions/scene1.html"
        data-start="0"
        data-duration="5.68"
        data-track-index="1"
      ></div>

      <div
        id="scene-2"
        class="clip"
        data-composition-id="s2"
        data-composition-src="compositions/scene2.html"
        data-start="5.68"
        data-duration="5.76"
        data-track-index="1"
      ></div>

      <div
        id="scene-3"
        class="clip"
        data-composition-id="s3"
        data-composition-src="compositions/scene3.html"
        data-start="11.44"
        data-duration="14.32"
        data-track-index="1"
      ></div>

      <div
        id="scene-4"
        class="clip"
        data-composition-id="s4"
        data-composition-src="compositions/scene4.html"
        data-start="25.76"
        data-duration="9.57"
        data-track-index="1"
      ></div>

      <audio
        id="narration"
        class="clip"
        data-start="0"
        data-duration="35.33"
        data-track-index="10"
        src="assets/narration.mp3"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
