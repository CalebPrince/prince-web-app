<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/error-log.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0c0e">
  <title>Prince Caleb, AI Systems</title>
  <meta name="description" content="Prince Caleb builds AI voice agents that answer business calls, chatbots, and workflow automations, engineered on 12+ years of custom web &amp; mobile development.">
  <style>
    :root {
      --bg: #0b0c0e;
      --accent: #62ff98;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* Same low-opacity blurred-accent-orb ambient motion already reused on
       the real homepage's hero (see app.css .hero-glow) — just enough life
       behind the mark that the page doesn't feel static while it builds. */
    .glow { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .glow::before, .glow::after {
      content: ""; position: absolute; width: 40vw; height: 40vw; border-radius: 50%;
      background: var(--accent); filter: blur(130px); opacity: .14;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .glow::before { top: -20%; left: 6%; }
    .glow::after { right: -10%; bottom: -30%; animation-delay: -6s; }
    @keyframes drift { to { transform: translate3d(7%, 7%, 0) scale(1.12); } }

    /* The real brand lockup animation — mark tumbles in, wordmark slides out
       from behind it, the dot settles last. Ported from app.css's .splash
       (built for a site-wide first-visit splash, never actually wired into
       any page) so this boot moment uses the site's own real brand motion
       instead of an unrelated one-off effect. */
    .lockup { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; }
    .brand-logo {
      display: inline-flex; align-items: center; gap: .5em;
      font-weight: 700; font-size: clamp(1.7rem, 6vw, 2.6rem); letter-spacing: -.02em; color: #fff;
    }
    .brand-mark {
      display: inline-flex; align-items: center; justify-content: center;
      width: 2.15em; height: 2.15em; font-size: .78em; font-weight: 800; line-height: 1;
      border-radius: .55em; background: #fff; color: var(--bg); flex-shrink: 0;
      animation: mark-in 1.1s var(--ease-out) both;
    }
    @keyframes mark-in {
      0% { opacity: 0; transform: scale(.5) rotate(-24deg); }
      55% { opacity: 1; transform: scale(1.06) rotate(4deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    .text-mask { display: inline-block; overflow: hidden; }
    .brand-text { display: inline-block; white-space: nowrap; animation: text-in .8s var(--ease-out) .55s both; }
    @keyframes text-in { from { transform: translateX(-110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .dot { color: #fff; display: inline-block; animation: dot-in .45s var(--ease-out) 1.3s both; }
    @keyframes dot-in { from { opacity: 0; transform: translateY(.4em); } to { opacity: 1; transform: translateY(0); } }

    /* No page underneath to reveal on this document — so instead of a
       curtain-lift, the lockup itself fades just before the redirect fires. */
    .lockup.exit { animation: exit .6s var(--ease-out) forwards; }
    @keyframes exit { to { opacity: 0; transform: translateY(-.4em); } }

    @media (prefers-reduced-motion: reduce) {
      .glow::before, .glow::after { animation: none; }
      .brand-mark, .brand-text, .dot { animation: none; opacity: 1; transform: none; }
      .lockup.exit { animation: none; }
    }
  </style>
</head>
<body>
  <h1 style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;">Turn more enquiries into booked customers, without adding more admin.</h1>
  <div class="glow" aria-hidden="true"></div>
  <div class="lockup" id="lockup">
    <span class="brand-logo">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span class="text-mask"><span class="brand-text">Prince Caleb<span class="dot">.</span></span></span>
    </span>
  </div>

  <script>
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const lockup = document.getElementById('lockup');

    if (reduceMotion) {
      setTimeout(() => window.location.replace('home.html'), 300);
    } else {
      setTimeout(() => lockup.classList.add('exit'), 2200);
      setTimeout(() => window.location.replace('home.html'), 2700);
    }
  </script>
  <script src="/js/analytics.js"></script>
</body>
</html>
