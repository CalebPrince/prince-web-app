<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020403" />
  <meta name="description" content="PrinceCaleb.dev cinematic terminal intro." />
  <title>Prince Caleb — System Online</title>

  <script>
    (() => {
      const introKey = "princecaleb_intro_seen_this_tab";
      try {
        if (sessionStorage.getItem(introKey) === "1") {
          window.location.replace("/home.html");
          return;
        }
        sessionStorage.setItem(introKey, "1");
      } catch (_) {
        // If storage is unavailable, keep the intro usable instead of blocking the site.
      }
    })();
  </script>

  <style>
    :root {
      --bg: #020403;
      --panel: rgba(5, 12, 8, 0.82);
      --panel-strong: rgba(4, 10, 7, 0.96);
      --green: #00ff6a;
      --green-soft: #9affbd;
      --cyan: #00eaff;
      --white: #f3fff7;
      --muted: rgba(222, 255, 232, 0.46);
      --line: rgba(0, 255, 106, 0.18);
      --danger: #ff4060;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--green);
      font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
      overflow: hidden;
    }

    button,
    a {
      font: inherit;
    }

    a {
      color: inherit;
    }

    .experience {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 42%, rgba(0, 255, 106, 0.08), transparent 28%),
        radial-gradient(circle at 18% 20%, rgba(0, 234, 255, 0.06), transparent 22%),
        linear-gradient(180deg, #010201 0%, #020403 50%, #010201 100%);
    }

    .aurora,
    .grid,
    .scanlines,
    .noise,
    .vignette,
    .sweep {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .aurora {
      inset: -30%;
      z-index: -7;
      background:
        radial-gradient(circle at 30% 35%, rgba(0, 255, 106, 0.08), transparent 23%),
        radial-gradient(circle at 75% 55%, rgba(0, 234, 255, 0.06), transparent 26%);
      filter: blur(30px);
      animation: aurora 14s ease-in-out infinite alternate;
    }

    @keyframes aurora {
      from { transform: translate3d(-2%, -2%, 0) scale(1); }
      to { transform: translate3d(2%, 2%, 0) scale(1.12); }
    }

    .grid {
      z-index: -6;
      opacity: 0.16;
      background-image:
        linear-gradient(rgba(0, 255, 106, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 106, 0.12) 1px, transparent 1px);
      background-size: 52px 52px;
      transform: perspective(800px) rotateX(68deg) scale(1.55) translateY(18%);
      transform-origin: center bottom;
      -webkit-mask-image: linear-gradient(to top, #000, transparent 75%);
      mask-image: linear-gradient(to top, #000, transparent 75%);
    }

    .scanlines {
      z-index: 20;
      opacity: 0.18;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        rgba(0, 255, 106, 0.045) 4px
      );
    }

    .noise {
      z-index: 22;
      opacity: 0.035;
      background-image: repeating-radial-gradient(
        circle at 0 0,
        rgba(255, 255, 255, 0.7) 0,
        rgba(255, 255, 255, 0.7) 1px,
        transparent 1px,
        transparent 3px
      );
      background-size: 5px 5px;
      animation: staticShift .18s steps(2) infinite;
    }

    @keyframes staticShift {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-1%, 1%); }
      50% { transform: translate(1%, -1%); }
      75% { transform: translate(1%, 1%); }
      100% { transform: translate(-1%, -1%); }
    }

    .vignette {
      z-index: 23;
      box-shadow: inset 0 0 190px rgba(0, 0, 0, 0.96);
    }

    .sweep {
      z-index: 21;
      top: -35%;
      height: 22%;
      background: linear-gradient(to bottom, transparent, rgba(0, 255, 106, 0.16), transparent);
      opacity: 0.42;
      animation: sweep 7s linear infinite;
    }

    @keyframes sweep {
      from { transform: translateY(-100%); }
      to { transform: translateY(650%); }
    }

    .hud {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
    }

    .hud-top,
    .hud-bottom {
      position: absolute;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.5rem;
      color: rgba(222, 255, 232, 0.38);
      font-size: .68rem;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .hud-top { top: 0; }
    .hud-bottom { bottom: 0; }

    .live {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
    }

    .live::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {
      50% { opacity: .28; transform: scale(.78); }
    }

    .stage {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 4.2rem 1rem 4.6rem;
    }

    .shell {
      width: min(720px, 100%);
      opacity: 0;
      transform: translateY(18px) scale(.985);
      animation: shellIn 900ms ease forwards 180ms;
    }

    @keyframes shellIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .terminal {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(7, 16, 10, 0.94), rgba(2, 6, 4, 0.96));
      box-shadow:
        0 36px 120px rgba(0, 0, 0, .65),
        0 0 70px rgba(0, 255, 106, .07),
        inset 0 0 50px rgba(0, 255, 106, .025);
      backdrop-filter: blur(20px);
    }

    .terminal::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 0 44%, rgba(255,255,255,.025) 47%, transparent 50%);
      transform: translateX(-120%);
      animation: terminalSheen 8s ease-in-out infinite 2s;
      pointer-events: none;
    }

    @keyframes terminalSheen {
      0%, 75% { transform: translateX(-120%); }
      100% { transform: translateX(120%); }
    }

    .terminal-head {
      min-height: 54px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 1rem;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.018);
    }

    .dots {
      display: flex;
      gap: .48rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.2);
    }

    .dot:nth-child(1) { background: #ff5f57; }
    .dot:nth-child(2) { background: #febc2e; }
    .dot:nth-child(3) { background: #28c840; }

    .terminal-title {
      color: rgba(255,255,255,.32);
      font-size: .72rem;
      letter-spacing: .08em;
      text-align: center;
    }

    .terminal-body {
      min-height: 0;
      height: min(390px, 54vh);
      padding: clamp(1rem, 3vw, 1.7rem);
      overflow: hidden;
    }

    .line {
      min-height: 1.65rem;
      display: flex;
      flex-wrap: wrap;
      gap: .7rem;
      margin: 0 0 .72rem;
      color: var(--green-soft);
      font-size: clamp(.78rem, 1.8vw, 1rem);
      line-height: 1.65;
      opacity: 0;
      transform: translateY(6px);
      animation: lineIn .35s ease forwards;
    }

    @keyframes lineIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .prompt { color: var(--cyan); }
    .command { color: var(--white); }
    .success { color: var(--green); }
    .muted { color: var(--muted); }
    .warn { color: #ffd166; }

    .cursor {
      display: inline-block;
      width: .62em;
      height: 1.05em;
      background: var(--green);
      box-shadow: 0 0 12px rgba(0, 255, 106, .7);
      vertical-align: -0.15em;
      animation: cursorBlink .75s steps(1) infinite;
    }

    @keyframes cursorBlink {
      50% { opacity: 0; }
    }

    .reveal {
      display: block;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      text-align: center;
      opacity: 0;
      transform: translateY(14px);
    }

    .reveal.show {
      display: block;
      animation: revealIn 900ms cubic-bezier(.16,.8,.24,1) forwards;
    }

    @keyframes revealIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .kicker {
      margin: 0 0 .9rem;
      color: rgba(222,255,232,.45);
      font-size: .68rem;
      letter-spacing: .3em;
      text-transform: uppercase;
    }

    .brand {
      position: relative;
      display: inline-block;
      margin: 0;
      color: var(--white);
      font-family: Inter, Arial, sans-serif;
      font-size: clamp(2rem, 6vw, 4.3rem);
      line-height: .94;
      letter-spacing: -.07em;
      text-transform: uppercase;
      text-shadow: 0 0 34px rgba(255,255,255,.1), 0 0 70px rgba(0,255,106,.13);
    }

    .brand::before,
    .brand::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .brand::before {
      color: var(--cyan);
      clip-path: inset(18% 0 61% 0);
      transform: translateX(2px);
      animation: glitchA 3s steps(1) infinite;
      opacity: .55;
    }

    .brand::after {
      color: var(--danger);
      clip-path: inset(68% 0 9% 0);
      transform: translateX(-2px);
      animation: glitchB 2.25s steps(1) infinite;
      opacity: .5;
    }

    @keyframes glitchA {
      0%, 88%, 100% { transform: translate(0); clip-path: inset(100% 0 0 0); }
      89% { transform: translate(-5px, 1px); clip-path: inset(18% 0 61% 0); }
      92% { transform: translate(4px, -1px); clip-path: inset(54% 0 26% 0); }
      95% { transform: translate(-2px, 0); clip-path: inset(78% 0 5% 0); }
    }

    @keyframes glitchB {
      0%, 84%, 100% { transform: translate(0); clip-path: inset(0 0 100% 0); }
      85% { transform: translate(5px, 1px); clip-path: inset(68% 0 9% 0); }
      89% { transform: translate(-4px, -1px); clip-path: inset(26% 0 50% 0); }
      93% { transform: translate(3px, 1px); clip-path: inset(7% 0 76% 0); }
    }

    .tagline {
      max-width: 680px;
      margin: .75rem auto 0;
      color: rgba(255,255,255,.58);
      font-family: Inter, Arial, sans-serif;
      font-size: clamp(.98rem, 2.1vw, 1.2rem);
      line-height: 1.7;
      text-wrap: balance;
    }

    .actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: .9rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .enter-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .72rem;
      min-width: 205px;
      padding: .9rem 1.35rem;
      border: 1px solid rgba(0, 255, 106, .45);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(0,255,106,.12), rgba(0,255,106,.06));
      color: var(--green-soft);
      text-decoration: none;
      letter-spacing: .04em;
      box-shadow: 0 0 0 rgba(0,255,106,0);
      overflow: hidden;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .enter-button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 20%, rgba(255,255,255,.18), transparent 80%);
      transform: translateX(-120%);
      transition: transform .55s ease;
    }

    .enter-button:hover {
      transform: translateY(-2px);
      border-color: var(--green);
      background: linear-gradient(180deg, rgba(0,255,106,.18), rgba(0,255,106,.09));
      box-shadow: 0 0 36px rgba(0,255,106,.15);
    }

    .enter-button:hover::before {
      transform: translateX(120%);
    }

    .enter-button span {
      position: relative;
      z-index: 1;
    }


    .enter-button.ready {
      border-color: var(--green);
      box-shadow: 0 0 34px rgba(0,255,106,.18);
      animation: readyPulse 2.2s ease-in-out infinite;
    }

    @keyframes readyPulse {
      50% { transform: translateY(-1px) scale(1.02); box-shadow: 0 0 48px rgba(0,255,106,.26); }
    }

    .skip-button {
      border: 0;
      background: transparent;
      color: rgba(222,255,232,.42);
      cursor: pointer;
      padding: .8rem 1rem;
      transition: color .2s ease;
    }

    .skip-button:hover { color: var(--green-soft); }

    .mini-status {
      margin-top: 1.15rem;
      color: rgba(222,255,232,.32);
      font-size: .7rem;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .flash {
      position: absolute;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      background: rgba(255,255,255,.75);
      opacity: 0;
    }

    .flash.run { animation: flash .28s ease-out; }

    @keyframes flash {
      0% { opacity: 0; }
      22% { opacity: .42; }
      100% { opacity: 0; }
    }

    @media (max-width: 700px) {
      .hud-top,
      .hud-bottom {
        padding: 1rem;
      }

      .hud-top span:last-child,
      .hud-bottom span:last-child {
        display: none;
      }

      .stage {
        padding: 3.8rem .7rem 4.2rem;
      }

      .terminal {
        border-radius: 17px;
      }

      .terminal-body {
        height: min(360px, 58vh);
        min-height: 0;
        padding: .9rem;
      }

      .terminal-title {
        font-size: .64rem;
      }

      .line {
        font-size: .68rem;
        line-height: 1.42;
        margin-bottom: .42rem;
      }

      .brand {
        font-size: clamp(2.15rem, 13vw, 4rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="experience" aria-label="Prince Caleb terminal intro">
    <div class="aurora"></div>
    <div class="grid"></div>
    <div class="sweep"></div>
    <div class="scanlines"></div>
    <div class="noise"></div>
    <div class="vignette"></div>
    <div class="flash" id="flash"></div>

    <div class="hud" aria-hidden="true">
      <div class="hud-top">
        <span class="live">System online</span>
        <span>PrinceCaleb.dev // Access Gateway</span>
      </div>
      <div class="hud-bottom">
        <span>Builder OS v1.0</span>
        <span>Encrypted session</span>
      </div>
    </div>

    <section class="stage">
      <div class="shell">
        <div class="terminal">
          <header class="terminal-head">
            <div class="dots" aria-hidden="true">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
            <div class="terminal-title">prince@builder-os:~</div>
            <div></div>
          </header>

          <div class="terminal-body" id="terminalBody" aria-live="polite">
            <div id="terminalOutput"></div>

            <div class="reveal" id="reveal">
              <p class="kicker">System ready</p>
              <h1 class="brand" data-text="PRINCE CALEB">Prince Caleb</h1>
              <p class="tagline">The operating system behind everything I build.</p>
            </div>
          </div>
        </div>

        <div class="actions" style="margin-top:1rem;">
          <a class="enter-button" id="enterButton" href="/home.html" aria-label="Enter PrinceCaleb.dev">
            <span id="enterLabel">Enter the system</span>
            <span aria-hidden="true">→</span>
          </a>
          <button class="skip-button" id="skipButton" type="button">Skip initialization</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const lines = [
      { type: "command", prompt: "prince@builder-os:~$", text: "initialize builder_os", delay: 300, speed: 22 },
      { type: "output", text: "Memory check....................OK", delay: 220 },
      { type: "output", text: "AI Core.........................OK", delay: 200 },
      { type: "status", text: "LISA........................ONLINE", delay: 190 },
      { type: "status", text: "Q1..........................ONLINE", delay: 190 },
      { type: "status", text: "LEDGER......................ONLINE", delay: 190 },
      { type: "status", text: "RADAR.......................ACTIVE", delay: 220 },
      { type: "muted", text: "One connected system.", delay: 260 },
      { type: "output", text: "ACCESS GRANTED", delay: 300 }
    ];
    const output = document.getElementById("terminalOutput");
    const reveal = document.getElementById("reveal");
    const skipButton = document.getElementById("skipButton");
    const flash = document.getElementById("flash");
    const enterButton = document.getElementById("enterButton");

    let cancelled = false;

    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

    function makeLine(className = "") {
      const line = document.createElement("p");
      line.className = `line ${className}`.trim();
      line.style.animationDelay = "0ms";
      output.appendChild(line);
      return line;
    }

    async function typeText(element, text, speed = 28) {
      for (const character of text) {
        if (cancelled) return;
        element.textContent += character;
        await wait(speed + Math.random() * 18);
      }
    }

    function triggerFlash() {
      flash.classList.remove("run");
      void flash.offsetWidth;
      flash.classList.add("run");
    }

    async function runSequence() {
      for (const item of lines) {
        if (cancelled) return;
        await wait(item.delay || 250);

        if (item.type === "command") {
          const line = makeLine();
          const prompt = document.createElement("span");
          prompt.className = "prompt";
          prompt.textContent = item.prompt;

          const command = document.createElement("span");
          command.className = "command";

          const cursor = document.createElement("span");
          cursor.className = "cursor";
          cursor.setAttribute("aria-hidden", "true");

          line.append(prompt, command, cursor);
          await typeText(command, item.text, item.speed || 28);
          cursor.remove();
        } else {
          const classMap = {
            output: "success",
            status: "success",
            muted: "muted"
          };

          const line = makeLine(classMap[item.type] || "");
          line.textContent = item.text;
        }
      }

      await wait(400);
      showReveal();
    }

    function showReveal() {
      if (reveal.classList.contains("show")) return;
      triggerFlash();
      reveal.classList.add("show");
      skipButton.style.opacity = "0";
      skipButton.style.pointerEvents = "none";
      enterButton.classList.add("ready");
    }

    function skipSequence() {
      cancelled = true;
      output.innerHTML = `
        <p class="line success">[OK] Initialization complete.</p>
        <p class="line success">ACCESS GRANTED</p>
      `;
      showReveal();
    }

    skipButton.addEventListener("click", skipSequence);

    window.addEventListener("load", () => {
      runSequence().catch(() => {
        skipSequence();
      });
    });
  </script>
</body>
</html>
