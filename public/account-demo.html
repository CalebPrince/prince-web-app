<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Private outcome walkthrough | Prince Caleb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/account-demo.css?v=20260728">
</head>
<body>
  <header class="demo-nav">
    <a class="demo-brand" href="/" aria-label="Prince Caleb home"><span>PC</span> Prince Caleb</a>
    <p>Private outcome walkthrough</p>
  </header>

  <main id="demo-shell" class="demo-shell" aria-live="polite">
    <div class="demo-loading">
      <span></span>
      <p>Preparing the walkthrough…</p>
    </div>
  </main>

  <template id="demo-template">
    <section class="demo-hero">
      <div class="demo-hero-copy">
        <p class="demo-kicker">Prepared for <strong data-business></strong></p>
        <h1 data-headline></h1>
        <p class="demo-deck" data-summary></p>
        <a class="demo-cta" data-cta><span data-cta-label></span><i aria-hidden="true">↗</i></a>
      </div>
      <aside class="demo-signal" aria-label="Proposed operating change">
        <span class="signal-label">The shift</span>
        <p data-friction></p>
        <div class="signal-line"><span></span><b>Routine work stays moving</b></div>
      </aside>
    </section>

    <section class="demo-playback" aria-labelledby="playback-title">
      <header>
        <p class="demo-kicker">One request, followed through</p>
        <h2 id="playback-title">What a quieter operation can feel like</h2>
      </header>
      <div class="workflow-track" data-workflow></div>
    </section>

    <section class="demo-proof">
      <div>
        <p class="demo-kicker">Built around evidence, not assumptions</p>
        <h2>A proposed starting point, ready for human review.</h2>
      </div>
      <p data-proof></p>
    </section>

    <section class="demo-close">
      <p>Start with one controlled workflow. Prove it in monitored use. Expand only when it earns trust.</p>
      <a class="demo-cta demo-cta-light" data-cta><span data-cta-label></span><i aria-hidden="true">↗</i></a>
    </section>
  </template>

  <script src="/js/account-demo.js?v=20260728"></script>
</body>
</html>
